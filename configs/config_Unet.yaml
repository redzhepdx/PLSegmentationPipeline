experiment_name: "experiment_[DATE]_[SPECS]"

data:
  root: ""
  images_folder: "images"
  masks_folder: "masks"
  val_output_folder: "validation_outputs"
  data_info_file: "train_data.pkl"
  prev_validation_set:
  crop_object: True
  mask_extension: ".jpg"


test_data:
  root: ""
  images_folder: "images"
  masks_folder: "masks_orig"
  output_mask_path: "prediction_results/"
  data_info_file: "test_data.pkl"
  crop_object: True
  mask_extension: ".jpg"


model:
  type: segmentation_models_pytorch.Unet
  encoder_name: "timm-efficientnet-b3"
  classes: 1
  encoder_weights: "imagenet"
  # decoder_attention_type: "scse"
  # decoder_use_batchnorm : False
  # activation: "sigmoid"

swa_parameters:
  type: torch.optim.swa_utils.SWALR
  swa_start: 0
  swa_lr: 0.0001
  swa_freq: 2

optimizer:
  type: torch_optimizer.RAdam
  lr: 0.0001

scheduler_ex:
  type: torch.optim.lr_scheduler.ReduceLROnPlateau
  factor: 0.5
  mode: "min"
  min_lr: 1e-08
  patience: 8

scheduler:
  type: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  T_0: 4
  T_mult: 1

resume_from_checkpoint:

train_parameters:
  batch_size: 4
  num_workers: 2

inference_parameters:
  threshold: 0.8
  max_edge_h: 3096
  max_edge_w: 3096
  split_edge: 2048
  test_time_augmentation: True
  activation:
  use_crf: True

checkpoint_callback:
  type: pytorch_lightning.callbacks.ModelCheckpoint
  dirpath: "2021-04-15-Unet"
  monitor: val_iou
  verbose: True
  mode: max
  save_top_k: -1


train_aug:
  transform:
    __class_fullname__: albumentations.core.composition.Compose
    bbox_params: null
    keypoint_params: null
    p: 1
    transforms:
      - __class_fullname__: albumentations.augmentations.transforms.LongestMaxSize
        always_apply: False
        max_size: 800
        p: 0
      - __class_fullname__: albumentations.augmentations.transforms.PadIfNeeded
        always_apply: False
        min_height: 512
        min_width: 512
        border_mode: 0 # cv2.BORDER_CONSTANT
        value: 0
        mask_value: 0
        p: 1
      - __class_fullname__: albumentations.augmentations.transforms.RandomCrop
        always_apply: False
        height: 1024
        width: 1024
        p: 1
      - __class_fullname__: albumentations.core.composition.OneOf
        p: 0.5
        transforms:
          - __class_fullname__: albumentations.augmentations.transforms.ImageCompression
            always_apply: False
            p: 0.5
          - __class_fullname__: albumentations.augmentations.transforms.Blur
            always_apply: False
            p: 0.5
          - __class_fullname__: albumentations.augmentations.transforms.RGBShift
            always_apply: False
            p: 0.5
          - __class_fullname__: albumentations.augmentations.transforms.RandomBrightnessContrast
            always_apply: False
            p: 0.5
          - __class_fullname__: albumentations.augmentations.transforms.RandomGamma
            always_apply: False
            p: 0.5
      - __class_fullname__: albumentations.core.composition.OneOf
        p: 0.5
        transforms:
          - __class_fullname__: albumentations.augmentations.transforms.VerticalFlip
            always_apply: False
            p: 0.5
          - __class_fullname__: albumentations.augmentations.transforms.HorizontalFlip
            always_apply: False
            p: 0.5
          - __class_fullname__: albumentations.augmentations.transforms.RandomRotate90
            always_apply: False
            p: 0.5
      - __class_fullname__: albumentations.augmentations.transforms.Normalize
        always_apply: false
        max_pixel_value: 255.0
        mean:
          - 0.485
          - 0.456
          - 0.406
        p: 1
        std:
          - 0.229
          - 0.224
          - 0.225

val_aug:
  transform:
    __class_fullname__: albumentations.core.composition.Compose
    bbox_params: null
    keypoint_params: null
    p: 1
    transforms:
      - __class_fullname__: albumentations.augmentations.transforms.LongestMaxSize
        always_apply: False
        max_size: 800
        p: 0
      - __class_fullname__: albumentations.augmentations.transforms.PadIfNeeded
        always_apply: False
        min_height: 1024
        min_width: 1024
        border_mode: 0 # cv2.BORDER_CONSTANT
        value: 0
        mask_value: 0
        p: 1
      - __class_fullname__: albumentations.augmentations.transforms.RandomCrop
        always_apply: False
        height: 1024
        width: 1024
        p: 1
      - __class_fullname__: albumentations.augmentations.transforms.Normalize
        always_apply: false
        max_pixel_value: 255.0
        mean:
          - 0.485
          - 0.456
          - 0.406
        p: 1
        std:
          - 0.229
          - 0.224
          - 0.225

test_aug:
  transform:
    __class_fullname__: albumentations.core.composition.Compose
    bbox_params: null
    keypoint_params: null
    p: 1
    transforms:
      - __class_fullname__: albumentations.augmentations.transforms.LongestMaxSize
        always_apply: False
        max_size: 800
        p: 0
      - __class_fullname__: albumentations.augmentations.transforms.Normalize
        always_apply: false
        max_pixel_value: 255.0
        mean:
          - 0.485
          - 0.456
          - 0.406
        p: 1
        std:
          - 0.229
          - 0.224
          - 0.225